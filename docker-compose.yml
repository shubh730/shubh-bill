services:
  backend:
    build:
      context: ./backend
    container_name: shubh_bill_backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,backend,0.0.0.0"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      SQLITE_PATH: "/app/data/db.sqlite3"
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: shubh_bill_frontend
    environment:
      VITE_API_BASE_URL: "http://127.0.0.1:8000/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlite_data:
